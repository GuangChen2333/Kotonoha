name: Update dictionaries

# 每两周的周三检查 JMdict 是否有新版本;有就更新 dict-version.meta.json、patch 版本号 +1、打 tag 并触发发布。
# cron 没法表达「每两周」,所以每周三都触发,按纪元以来的周数奇偶跳过一半。
on:
  schedule:
    - cron: '0 3 * * 3'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    name: Check JMdict and release
    runs-on: ubuntu-22.04

    steps:
      - name: Skip off weeks
        if: github.event_name == 'schedule'
        run: |
          if [ $(( $(date +%s) / 604800 % 2 )) -ne 0 ]; then
            echo "Off week, skipping."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - name: Checkout
        if: env.SKIP != 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: env.SKIP != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check for a new JMdict release
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api repos/scriptin/jmdict-simplified/releases/latest -q .tag_name)"
          current="$(node -p "require('./dict-version.meta.json').jmdictSimplified")"
          echo "current=$current latest=$latest"
          if [ "$latest" = "$current" ]; then
            echo "JMdict is up to date."
            echo "SKIP=true" >> "$GITHUB_ENV"
          else
            echo "LATEST=$latest" >> "$GITHUB_ENV"
          fi

      - name: Bump version and tag
        if: env.SKIP != 'true'
        run: |
          node -e '
            const fs = require("fs")
            const meta = JSON.parse(fs.readFileSync("dict-version.meta.json", "utf8"))
            meta.jmdictSimplified = process.env.LATEST
            fs.writeFileSync("dict-version.meta.json", JSON.stringify(meta, null, 2) + "\n")
          '
          version="$(node scripts/bump-version.mjs)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update jmdict to ${LATEST} and release ${version}"
          git tag "v${version}"
          git push origin HEAD "v${version}"
          echo "TAG=v${version}" >> "$GITHUB_ENV"

      # 用 GITHUB_TOKEN 推的 tag 不会触发其他 workflow,所以显式调用发布流程
      - name: Trigger release
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml -f tag="$TAG"
